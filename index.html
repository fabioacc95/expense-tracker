<!doctype html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker V3</title>
  <style>
:root{--bg:#f5f5f7;--card:#fff;--text:#111;--muted:#8e8e93;--line:#e5e5ea;--blue:#007AFF;--input:#fff;--nav:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--line:#38383a;--input:#2c2c2e;--nav:#1c1c1e}}
:root[data-theme=light]{--bg:#f5f5f7;--card:#fff;--text:#111;--muted:#8e8e93;--line:#e5e5ea;--input:#fff;--nav:#fff}
:root[data-theme=dark]{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--line:#38383a;--input:#2c2c2e;--nav:#1c1c1e}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:980px;margin:auto;min-height:100vh;padding:24px 18px 110px;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:24px;margin:0}.date{font-size:14px;color:var(--muted)}
.home{flex:1;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:20px 0}
.home-center{display:flex;align-items:center;justify-content:center;flex:1}
.add-btn{border:0;border-radius:999px;background:#007AFF;color:#fff;padding:18px 34px;font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 10px 25px #007aff35}
.spent{text-align:center;width:100%;max-width:400px;margin-bottom:10px}
.spent-label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
.spent-value{font-size:26px;font-weight:700;color:var(--text);margin-top:4px}
.budget-progress-bg{background:var(--line);height:8px;border-radius:4px;overflow:hidden;margin-top:8px}
.budget-progress-fill{background:var(--blue);height:100%;transition:width .3s}
.budget-info{font-size:12px;color:var(--muted);margin-top:6px}
nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(700px,calc(100% - 28px));background:var(--nav);border:1px solid var(--line);border-radius:22px;padding:8px;display:flex;gap:4px;box-shadow:0 8px 30px #0002;z-index:10}
nav button{flex:1;border:0;background:transparent;padding:12px 8px;border-radius:16px;cursor:pointer;color:var(--muted);font-size:13px}nav button.active{background:#8882;color:var(--text);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric strong{font-size:22px;display:block;margin-top:6px}.metric span{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}th{font-size:13px;color:var(--muted)}
.form{max-width:620px;margin:auto}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:var(--input);color:var(--text);box-sizing:border-box}
.save{width:100%;border:0;border-radius:14px;padding:15px;background:#007AFF;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted,.settings-note{color:var(--muted)}.empty{text-align:center;padding:50px}
.settings-section{padding:18px 0;border-top:1px solid var(--line)}.settings-section:first-of-type{border-top:0}.appearance-options{display:flex;gap:8px;margin-top:12px}
.appearance-options button{flex:1;padding:12px;border:1px solid var(--line);background:var(--input);color:var(--text);border-radius:12px;cursor:pointer}.appearance-options button.selected{border-color:#007AFF;color:#007AFF;font-weight:700}
.settings-action{width:100%;padding:13px;margin-top:8px;border:1px solid var(--line);background:var(--input);color:var(--text);border-radius:12px;text-align:left;cursor:pointer;font-size:15px}input[type=file]{display:none}
.btn-icon{background:none;border:none;cursor:pointer;font-size:16px;padding:4px 8px;border-radius:6px}
.chart-container{margin-top:16px;margin-bottom:16px;position:relative}
.bar-row{display:flex;align-items:center;margin-bottom:8px;font-size:13px}
.bar-label{width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.bar-track{flex:1;background:var(--line);height:14px;border-radius:7px;margin:0 10px;overflow:hidden}
.bar-fill{background:#007AFF;height:100%;border-radius:7px}
.bar-val{width:80px;text-align:right;font-weight:600}
.cycle-select{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--input);color:var(--text);font-size:14px;margin-bottom:16px}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.app{padding-top:18px}.add-btn{font-size:20px;padding:16px 28px}}
</style>
</head>
<body><div id="root"></div>
<script>
const categories={"Animais":["Brinquedos","Consultas","Medicação","Ração","Outro"],"Carro":["Inspeção","Limpeza","Manutenção","Peças","Reparação","Seguro","Selo","Outro"],"Casa":["Condomínio","Decoração","Eletrodomésticos","Mobiliário","Reparações","Seguros","Outro"],"Empréstimos":["Apartamento","Carro","Cartão de Crédito"],"Gasóleo":[],"Restauração":["Almoço","Café","Cerveja","Jantar","Lanche","Whisky","Outro"],"Roupa":[],"Saúde":["Consulta Médica","Medicação","Outro"],"Supermercado":[],"Transportes":[],"Outros":[]};
let expenses=JSON.parse(localStorage.getItem("expenses_v3")||"[]"),page="home",theme=localStorage.getItem("theme_v3")||"system",budget=parseFloat(localStorage.getItem("budget_v3")||"0"),editingId=null,selectedCycleOffset=0;

function applyTheme(){if(theme==="system")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",theme)}applyTheme();
const euro=n=>new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR"}).format(n||0),today=()=>new Date().toISOString().slice(0,10);
function dateLabel(){const d=new Date(),m=d.toLocaleDateString("en-US",{month:"long"});return m[0].toUpperCase()+m.slice(1)+" "+d.getDate()+", "+d.getFullYear()}
function save(){localStorage.setItem("expenses_v3",JSON.stringify(expenses))}

function isHoliday(date){
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  const fixed=['1-1','4-25','5-1','6-10','8-15','10-5','11-1','12-1','12-8','12-25'];
  return fixed.includes(`${m}-${d}`);
}

function getCutoffDate(year, monthIndex) {
  let d = new Date(year, monthIndex, 25);
  while (d.getDay() === 0 || d.getDay() === 6 || isHoliday(d)) {
    d.setDate(d.getDate() - 1);
  }
  return d;
}

function getCycleRange(offset = 0) {
  const now = new Date();
  let currentYear = now.getFullYear();
  let currentMonth = now.getMonth(); 

  let currentCutoff = getCutoffDate(currentYear, currentMonth);
  let cycleMonthIndex = (now >= currentCutoff) ? currentMonth : currentMonth - 1;

  cycleMonthIndex += offset;

  let targetDateForStart = new Date(currentYear, cycleMonthIndex, 1);
  let startYear = targetDateForStart.getFullYear();
  let startMonth = targetDateForStart.getMonth();
  let startDate = getCutoffDate(startYear, startMonth);

  let targetDateForEnd = new Date(startYear, startMonth + 1, 1);
  let endYear = targetDateForEnd.getFullYear();
  let endMonth = targetDateForEnd.getMonth();
  let nextCutoff = getCutoffDate(endYear, endMonth);
  
  let endDate = new Date(nextCutoff);
  endDate.setDate(endDate.getDate() - 1);

  return { startDate, endDate, label: `${startDate.toLocaleDateString("pt-PT")} - ${endDate.toLocaleDateString("pt-PT")}` };
}

function getExpensesForCycle(offset = 0) {
  const { startDate, endDate } = getCycleRange(offset);
  const startStr = startDate.toISOString().slice(0,10);
  const endStr = endDate.toISOString().slice(0,10);
  return expenses.filter(e => e.date >= startStr && e.date <= endStr);
}

function nav(){return '<nav><button class="'+(page==="home"?"active":"")+'" data-page="home">🏡<br>Home</button><button class="'+(page==="expenses"?"active":"")+'" data-page="expenses">💰<br>Expenses</button><button class="'+(page==="analysis"?"active":"")+'" data-page="analysis">📊<br>Analysis</button><button class="'+(page==="settings"?"active":"")+'" data-page="settings">⚙️<br>Settings</button></nav>'}

function home(){
  let cycleExp = getExpensesForCycle(0);
  let totalSpent = cycleExp.reduce((s,e)=>s+e.value,0);
  let pct = budget > 0 ? Math.min((totalSpent / budget) * 100, 100) : 0;
  
  return '<section class="home">' +
           '<div class="home-center">' +
             '<button class="add-btn" id="goAdd">+ Add expense</button>' +
           '</div>' +
           '<div class="spent">' +
             '<div class="spent-label">spent so far (current cycle)</div>' +
             '<div class="spent-value">'+euro(totalSpent)+'</div>' +
             (budget > 0 ? 
               '<div class="budget-progress-bg"><div class="budget-progress-fill" style="width:'+pct+'%;'+(totalSpent>budget?'background:#ff3b30':'')+'"></div></div>' +
               '<div class="budget-info">'+euro(totalSpent)+' of '+euro(budget)+' budget ('+pct.toFixed(0)+'%)</div>' 
               : '') +
           '</div>' +
         '</section>';
}

function add(){
  let item = editingId ? expenses.find(e => e.id == editingId) : null;
  let val = item ? item.value : "";
  let cat = item ? item.category : "";
  let sub = item ? item.sub : "";
  let dt = item ? item.date : today();
  let nt = item ? item.notes : "";

  return '<section class="card form"><h2>'+(editingId ? 'Edit expense' : 'Add expense')+'</h2>' +
         '<div class="field"><label>Amount</label><input id="value" type="number" inputmode="decimal" step="0.01" min="0" value="'+val+'" autofocus placeholder="0.00"></div>' +
         '<div class="field"><label>Category</label><select id="cat"><option value="">Select category</option>'+Object.keys(categories).map(c=>'<option '+(c===cat?'selected':'')+'>'+c+'</option>').join("")+'</select></div>' +
         '<div class="field" id="subwrap" style="'+(cat && categories[cat] && categories[cat].length ? 'block':'none')+'"><label>Subcategory</label><select id="sub"><option value="">Select subcategory</option>'+(cat && categories[cat] ? categories[cat].map(x=>'<option '+(x===sub?'selected':'')+'>'+x+'</option>').join(""): "")+'</select></div>' +
         '<div class="field"><label>Date</label><input id="date" type="date" value="'+dt+'"></div>' +
         '<div class="field"><label>Notes (optional)</label><textarea id="notes" rows="3" placeholder="Notes">'+nt+'</textarea></div>' +
         '<button class="save" id="save">'+(editingId ? 'Update expense' : 'Save expense')+'</button></section>';
}

function list(){
  let a=[...expenses].sort((x,y)=>y.date.localeCompare(x.date));
  if(!a.length)return '<section class="card empty">No expenses recorded yet.</section>';
  return '<section class="card"><div class="row"><h2>Expenses</h2><strong>'+euro(expenses.reduce((s,e)=>s+e.value,0))+'</strong></div><table><thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Actions</th></tr></thead><tbody>'+a.map(e=>'<tr><td>'+new Date(e.date+"T12:00").toLocaleDateString("en-GB")+'</td><td>'+e.category+(e.sub?" / "+e.sub:"")+'</td><td>'+euro(e.value)+'</td><td><button class="btn-icon edit" data-id="'+e.id+'">✏️</button><button class="btn-icon delete" data-id="'+e.id+'">✕</button></td></tr>').join("")+'</tbody></table></section>';
}

function renderCategoryChart(catTotals, total) {
  let entries = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  if (!entries.length) return '<div class="muted">No data for this period.</div>';
  return entries.map(([c, v]) => {
    let p = total ? (v / total * 100).toFixed(1) : 0;
    return '<div class="bar-row">' +
             '<div class="bar-label" title="'+c+'">'+c+'</div>' +
             '<div class="bar-track"><div class="bar-fill" style="width:'+p+'%"></div></div>' +
             '<div class="bar-val">'+euro(v)+'</div>' +
           '</div>';
  }).join("");
}

function renderDailyTrendChart(cycleExp, startDate, endDate) {
  let dailyMap = {};
  let cur = new Date(startDate);
  while (cur <= endDate) {
    dailyMap[cur.toISOString().slice(0,10)] = 0;
    cur.setDate(cur.getDate() + 1);
  }
  cycleExp.forEach(e => {
    if (dailyMap[e.date] !== undefined) dailyMap[e.date] += e.value;
  });

  let dates = Object.keys(dailyMap).sort();
  let values = dates.map(d => dailyMap[d]);
  let maxVal = Math.max(...values, 10);

  let width = 600, height = 150, padding = 20;
  let points = values.map((v, i) => {
    let x = padding + (i / (values.length - 1 || 1)) * (width - 2 * padding);
    let y = height - padding - (v / maxVal) * (height - 2 * padding);
    return `${x},${y}`;
  }).join(" ");

  let areaPoints = `${padding},${height - padding} ${points} ${width - padding},${height - padding}`;

  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;overflow:visible;">
    <polygon points="${areaPoints}" fill="rgba(0,122,255,0.15)" />
    <polyline points="${points}" fill="none" stroke="#007AFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function analysis(){
  let { startDate, endDate, label } = getCycleRange(selectedCycleOffset);
  let a = getExpensesForCycle(selectedCycleOffset);
  let t = a.reduce((s,e)=>s+e.value,0);
  
  let b = {};
  a.forEach(e => b[e.category] = (b[e.category] || 0) + e.value);

  let daysCount = Math.max(1, Math.round((new Date() - startDate) / (1000 * 60 * 60 * 24)));
  if (selectedCycleOffset !== 0) {
    daysCount = Math.round((endDate - startDate) / (1000 * 60 * 60 * 24)) + 1;
  }

  return '<section class="card">' +
           '<div class="row"><h2>Analysis</h2>' +
             '<select id="cycleSelect" class="cycle-select">' +
               '<option value="0" '+(selectedCycleOffset===0?'selected':'')+'>Current Cycle ('+label+')</option>' +
               '<option value="-1" '+(selectedCycleOffset===-1?'selected':'')+'>Previous Cycle</option>' +
               '<option value="-2" '+(selectedCycleOffset===-2?'selected':'')+'>2 Cycles Ago</option>' +
               '<option value="-3" '+(selectedCycleOffset===-3?'selected':'')+'>3 Cycles Ago</option>' +
             '</select>' +
           '</div>' +
           '<div class="grid">' +
             '<div class="metric"><span>Total spent</span><strong>'+euro(t)+'</strong></div>' +
             '<div class="metric"><span>Expenses</span><strong>'+a.length+'</strong></div>' +
             '<div class="metric"><span>Daily avg</span><strong>'+euro(t / (daysCount || 1))+'</strong></div>' +
             '<div class="metric"><span>Avg/expense</span><strong>'+euro(a.length ? t / a.length : 0)+'</strong></div>' +
           '</div>' +
         '</section>' +
         '<section class="card"><h3>Spending by category</h3>' + renderCategoryChart(b, t) + '</section>' +
         '<section class="card"><h3>Daily Trend</h3><div class="chart-container">' + renderDailyTrendChart(a, startDate, endDate) + '</div></section>';
}

function settings(){
  return '<section class="card"><h2>Settings</h2>' +
         '<div class="settings-section"><h3>Monthly Budget</h3><div class="settings-note">Set your monthly budget limit for tracking.</div>' +
         '<div class="field" style="margin-top:10px;"><input id="budgetValue" type="number" step="0.01" value="'+(budget||'')+'" placeholder="0.00"></div>' +
         '<button class="settings-action" id="saveBudget" style="text-align:center;background:var(--blue);color:#fff;font-weight:700;">Save Budget</button></div>' +
         '<div class="settings-section"><h3>Appearance</h3><div class="settings-note">Choose how the app should look.</div><div class="appearance-options"><button class="'+(theme==="system"?"selected":"")+'" data-theme="system">Automatic</button><button class="'+(theme==="light"?"selected":"")+'" data-theme="light">Light</button><button class="'+(theme==="dark"?"selected":"")+'" data-theme="dark">Dark</button></div></div>' +
         '<div class="settings-section"><h3>Data</h3><div class="settings-note">Keep a backup of your expenses or restore them on a new iPhone.</div><button class="settings-action" id="exportBackup">Export backup</button><button class="settings-action" id="importBackup">Import backup</button><button class="settings-action" id="exportCSV">Export CSV</button><input type="file" id="backupFile" accept=".json,application/json"></div>' +
         '</section>';
}

function download(name,data,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}

function render(){
  document.getElementById("root").innerHTML='<div class="app"><header><h1>Expense Tracker</h1><span class="date">'+dateLabel()+'</span></header><main>'+(page==="home"?home():page==="add"?add():page==="expenses"?list():page==="analysis"?analysis():settings())+'</main>'+nav()+'</div>';
  bind();
}

function bind(){
  document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page; if(page!=="add") editingId=null; render()});
  document.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{theme=b.dataset.theme;localStorage.setItem("theme_v3",theme);applyTheme();render()});
  
  const goAdd = document.getElementById("goAdd");
  if(goAdd) goAdd.onclick = () => { editingId = null; page = "add"; render(); };

  const cat=document.getElementById("cat");
  if(cat)cat.onchange=()=>{
    let o=categories[cat.value]||[];
    document.getElementById("subwrap").style.display=o.length?"block":"none";
    document.getElementById("sub").innerHTML='<option value="">Select subcategory</option>'+o.map(x=>'<option>'+x+'</option>').join("");
  };

  const saveBtn=document.getElementById("save");
  if(saveBtn)saveBtn.onclick=()=>{
    let v=parseFloat(document.getElementById("value").value);
    if(!v||!cat.value){alert("Enter an amount and select a category.");return}
    
    if (editingId) {
      expenses = expenses.map(e => e.id == editingId ? {
        id: e.id,
        value: v,
        category: cat.value,
        sub: document.getElementById("sub")?.value||"",
        date: document.getElementById("date").value,
        notes: document.getElementById("notes").value
      } : e);
      editingId = null;
    } else {
      expenses.push({
        id: Date.now(),
        value: v,
        category: cat.value,
        sub: document.getElementById("sub")?.value||"",
        date: document.getElementById("date").value,
        notes: document.getElementById("notes").value
      });
    }
    
    save();
    page="home";
    render();
  };

  document.querySelectorAll(".edit").forEach(b=>b.onclick=()=>{
    editingId = b.dataset.id;
    page = "add";
    render();
  });

  document.querySelectorAll(".delete").forEach(b=>b.onclick=()=>{
    if (confirm("Are you sure you want to delete this expense?")) {
      expenses=expenses.filter(e=>e.id!=b.dataset.id);
      save();
      render();
    }
  });

  const cycleSel = document.getElementById("cycleSelect");
  if(cycleSel) cycleSel.onchange = (e) => { selectedCycleOffset = parseInt(e.target.value); render(); };

  const saveBudget = document.getElementById("saveBudget");
  if(saveBudget) saveBudget.onclick = () => {
    budget = parseFloat(document.getElementById("budgetValue").value) || 0;
    localStorage.setItem("budget_v3", budget);
    alert("Budget updated successfully!");
    render();
  };

  const eb=document.getElementById("exportBackup");if(eb)eb.onclick=()=>download("expense-tracker-backup.json",JSON.stringify({version:3,exportedAt:new Date().toISOString(),expenses,budget},null,2),"application/json");
  const ib=document.getElementById("importBackup"),bf=document.getElementById("backupFile");if(ib)ib.onclick=()=>bf.click();if(bf)bf.onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.expenses))throw 0;expenses=d.expenses;if(d.budget)budget=d.budget;save();alert("Backup imported successfully.");render()}catch{alert("Invalid backup file.")}};
  const csv=document.getElementById("exportCSV");if(csv)csv.onclick=()=>{let r=[["Date","Category","Subcategory","Amount","Notes"],...expenses.map(e=>[e.date,e.category,e.sub||"",e.value,e.notes||""])];download("expense-tracker.csv",r.map(x=>x.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(",")).join("\n"),"text/csv;charset=utf-8")};
}

render();
</script>
</body>
</html>
